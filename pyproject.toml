[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumix-mcp"
version = "0.1.0"
description = "Control Panasonic LUMIX cameras over USB: LUT Library, settings, capture; MCP server included"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["pyusb>=1.3", "mcp>=2"]

[project.scripts]
lumix-mcp = "lumix.mcp_server:main"

[tool.setuptools]
packages = ["lumix"]
